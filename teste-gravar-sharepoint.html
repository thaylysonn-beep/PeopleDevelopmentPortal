
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste seguro de gravação — PDP</title>
</head>

<body style="font-family:Arial;max-width:750px;margin:40px auto;padding:20px">

  <h2>Teste de gravação no SharePoint</h2>

  <p>
    Esta ferramenta envia um JSON completo para o fluxo de teste.
    Confirme no Power Automate que o destino é somente pdp_teste.json.
  </p>

  <label for="url">URL HTTP do fluxo de teste</label>
  <input
    id="url"
    type="password"
    autocomplete="off"
    style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0"
  >

  <label for="arquivo"><strong>1. Selecione uma cópia do banco JSON</strong></label>
  <input
    id="arquivo"
    type="file"
    accept=".json,application/json"
    style="display:block;margin:12px 0"
  >

  <p id="infoArquivo">Nenhum arquivo selecionado.</p>

  <label for="json"><strong>2. Conteúdo JSON que será enviado</strong></label>
  <textarea
    id="json"
    rows="12"
    spellcheck="false"
    placeholder="O conteúdo do arquivo selecionado aparecerá aqui."
    style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;font-family:monospace"
  ></textarea>

  <label style="display:block;margin:15px 0">
    <input id="confirmar" type="checkbox">
    Confirmei que estou usando uma cópia e que o fluxo grava
    exclusivamente no arquivo de teste, não no banco oficial.
  </label>

  <button id="testar" disabled style="padding:12px 18px">
    Gravar cópia no SharePoint
  </button>

  <pre id="resultado"
    style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f2f2;padding:12px;margin-top:20px"></pre>

  <script>
    const arquivoInput = document.getElementById("arquivo");
    const campoJson = document.getElementById("json");
    const infoArquivo = document.getElementById("infoArquivo");
    const confirmar = document.getElementById("confirmar");
    const botao = document.getElementById("testar");
    const resultado = document.getElementById("resultado");

    let arquivoValido = false;
    let tamanhoOriginal = 0;

    function validarJson(texto) {
      try {
        const dados = JSON.parse(texto);

        if (
          dados === null ||
          typeof dados !== "object" ||
          Array.isArray(dados)
        ) {
          throw new Error("A raiz do JSON precisa ser um objeto.");
        }

        const chaves = Object.keys(dados);

        if (chaves.length < 3 || texto.length < 1000) {
          throw new Error(
            "O conteúdo parece incompleto ou ser um JSON de teste. " +
            "Selecione o banco completo e confira sua estrutura."
          );
        }

        if (
          Object.hasOwn(dados, "mensagem") &&
          Object.hasOwn(dados, "atualizadoEm") &&
          chaves.every(
            chave => ["mensagem", "atualizadoEm"].includes(chave)
          )
        ) {
          throw new Error(
            "Mensagem de teste detectada. Gravação bloqueada."
          );
        }

        return { dados, chaves };
      } catch (erro) {
        throw erro instanceof SyntaxError
          ? new Error("JSON inválido. Confira o conteúdo do arquivo.")
          : erro;
      }
    }

    function atualizarBotao() {
      botao.disabled = !arquivoValido || !confirmar.checked;
    }

    arquivoInput.addEventListener("change", async () => {
      arquivoValido = false;
      atualizarBotao();

      const arquivo = arquivoInput.files[0];

      if (!arquivo) {
        infoArquivo.textContent = "Nenhum arquivo selecionado.";
        return;
      }

      try {
        const texto = await arquivo.text();
        const validacao = validarJson(texto);

        campoJson.value = JSON.stringify(validacao.dados, null, 2);
        tamanhoOriginal = arquivo.size;
        arquivoValido = true;

        infoArquivo.textContent =
          `Arquivo: ${arquivo.name}\n` +
          `Tamanho: ${arquivo.size.toLocaleString("pt-BR")} bytes\n` +
          `Propriedades principais: ${validacao.chaves.join(", ")}`;

        resultado.textContent =
          "JSON válido carregado. Confira o conteúdo antes de enviar.";

      } catch (erro) {
        campoJson.value = "";
        infoArquivo.textContent = "Arquivo rejeitado.";
        resultado.textContent = erro.message;
      }

      atualizarBotao();
    });

    campoJson.addEventListener("input", () => {
      try {
        validarJson(campoJson.value);
        arquivoValido = false;

        resultado.textContent =
          "O conteúdo foi editado manualmente. " +
          "Selecione novamente o arquivo JSON original para habilitar a gravação.";
      } catch (erro) {
        arquivoValido = false;
        resultado.textContent = erro.message;
      }

      atualizarBotao();
    });

    confirmar.addEventListener("change", atualizarBotao);

    botao.addEventListener("click", async () => {
      const url = document.getElementById("url").value.trim();

      if (!url.startsWith("https://")) {
        resultado.textContent = "Informe uma URL HTTPS válida.";
        return;
      }

      let dados;

      try {
        const texto = campoJson.value;
        const validacao = validarJson(texto);
        dados = validacao.dados;

        if (!arquivoValido) {
          throw new Error(
            "Selecione novamente o arquivo JSON original antes de gravar."
          );
        }

        if (JSON.stringify(dados, null, 2) !== texto) {
          throw new Error(
            "O conteúdo foi alterado. Selecione novamente o arquivo original."
          );
        }
      } catch (erro) {
        resultado.textContent = erro.message;
        return;
      }

      const autorizado = confirm(
        "ATENÇÃO: o fluxo substituirá o conteúdo do arquivo configurado.\n\n" +
        "Confirme que o destino é pdp_teste.json e que você possui uma cópia de segurança.\n\n" +
        "Deseja continuar?"
      );

      if (!autorizado) return;

      botao.disabled = true;
      resultado.textContent = "Enviando JSON completo para o fluxo...";

      try {
        const resposta = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(dados)
        });

        const textoResposta = await resposta.text();

        resultado.textContent =
          `Status HTTP: ${resposta.status}\n` +
          `Resposta: ${textoResposta}\n\n` +
          (
            resposta.ok
              ? "O fluxo respondeu com sucesso. Confira o arquivo no SharePoint."
              : "A gravação falhou. Confira o histórico de execução do fluxo."
          );

      } catch (erro) {
        resultado.textContent =
          "Não foi possível confirmar a resposta do fluxo: " +
          erro.message +
          "\nVerifique o histórico de execução antes de tentar novamente.";

      } finally {
        botao.disabled = false;
        atualizarBotao();
      }
    });
  </script>

</body>
</html>
