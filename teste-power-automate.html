
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste Power Automate — PDP</title>
</head>
<body style="font-family:Arial;max-width:650px;margin:40px auto;padding:20px">
  <h2>Teste de conexão do PDP</h2>
  <p>Este teste não acessa nem altera o banco real.</p>

  <label for="url">URL HTTP do fluxo de teste</label>
  <input id="url" type="password" autocomplete="off"
    style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0">

  <button id="testar" style="padding:12px">Testar conexão</button>
  <pre id="resultado" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>

  <script>
    document.getElementById("testar").onclick = async () => {
      const url = document.getElementById("url").value.trim();
      const resultado = document.getElementById("resultado");

      if (!url.startsWith("https://")) {
        resultado.textContent = "Informe uma URL HTTPS válida.";
        return;
      }

      resultado.textContent = "Enviando teste...";

      try {
        const resposta = await fetch(url, {
          method: "POST",
          headers: {
            ""Content-Type": "application/json""
          },
          body: JSON.stringify({
            acao: "teste",
            mensagem: "Conexao PDP"
          })
        });

        resultado.textContent =
          "Status HTTP: " + resposta.status +
          "\nResposta: " + await resposta.text();
      } catch (erro) {
        resultado.textContent =
          "Falha no navegador: " + erro.message +
          "\nPode ser CORS, rede ou URL inválida.";
      }
    };
  </script>
</body>
</html>
